name: Build

# Compile les installateurs et publie la version indiquée dans package.json
# (ex. "version": "1.0.1" → release v1.0.1).
# Se lance à la main (onglet Actions → Build → Run workflow) ou sur un tag v*.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Créer la release brouillon
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "false" ]; then
              echo "::error::La version $TAG est déjà publiée. Augmente \"version\" dans package.json."
              exit 1
            fi
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Projet P.A.R.A.D.O.X. $TAG" --notes "Projet P.A.R.A.D.O.X. $TAG"
          fi

  release:
    needs: prepare
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    # macOS est facultatif : GitHub manque parfois de machines Mac.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always
        shell: bash

  publier:
    needs: [prepare, release]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Vérifier que l'installateur Windows est bien là
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | tee /tmp/assets
          grep -q "Projet-PARADOX-setup-${{ needs.prepare.outputs.version }}.exe" /tmp/assets || { echo "::error::Installateur Windows manquant, release non publiée."; exit 1; }
      - name: Publier la release (les launchers des joueurs la verront)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          if [[ "$TAG" == *-* ]]; then
            # ex. v1.0.1-test.1 : pré-version, ignorée par les launchers des joueurs
            gh release edit "$TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi

  lien-direct:
    needs: [prepare, publier]
    if: ${{ !cancelled() && needs.publier.result == 'success' && !contains(needs.prepare.outputs.version, '-') }}
    uses: ./.github/workflows/lien-direct.yml
    permissions:
      contents: write
