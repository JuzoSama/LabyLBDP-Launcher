name: Mod - Flèches persistantes

# Compile le mod serveur « laby_fleches » à chaque modification de son code.
on:
  push:
    paths:
      - 'serveur-mods/fleches-persistantes/**'
      - '.github/workflows/mod-fleches.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serveur-mods/fleches-persistantes
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.8'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v5
        with:
          name: laby_fleches
          path: serveur-mods/fleches-persistantes/build/libs/*.jar
