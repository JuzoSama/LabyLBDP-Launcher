# Textes et liens propres à ton launcher.
# Tout ce qui est ici remplace les valeurs de fr_FR.toml / en_US.toml.

[ejs.app]
title = "Laby LBDP"

[ejs.landing]
# Liens des icônes en bas à gauche de l'écran d'accueil. Mets "#" pour un lien inactif.
mediaGitHubURL = "https://github.com/JuzoSama/LabyLBDP-Launcher"
mediaXURL = "#"
mediaInstagramURL = "#"
mediaYouTubeURL = "#"
mediaDiscordURL = "#"

[ejs.settings]
sourceGithubLink = "https://github.com/JuzoSama/LabyLBDP-Launcher"
supportLink = "https://github.com/JuzoSama/LabyLBDP-Launcher/issues"

[ejs.welcome]
# Texte provisoire de l'écran de bienvenue (premier lancement) : à réécrire à ton goût.
welcomeHeader = "BIENVENUE SUR LABY LBDP"
welcomeDescription = "Ce launcher installe et met à jour tout seul Minecraft, Forge et les mods du serveur. Connecte-toi avec ton compte Microsoft, clique sur Jouer, et tu es dans le labyrinthe."
welcomeDescCTA = "Plus que quelques clics avant d'entrer."

[js.landing.discord]
# Textes affichés dans le statut Discord des joueurs
loading = "Chargement du jeu.."
joining = "Entre dans le labyrinthe.."
joined = "Explore le labyrinthe"
