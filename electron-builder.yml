appId: 'fr.labylbdp.launcher'
productName: 'Projet PARADOX'
artifactName: 'Projet-PARADOX-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Projet P.A.R.A.D.O.X. — basé sur Helios Launcher © 2018-2026 Daniel Scalzi'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,serveur-mods,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'Projet-PARADOX-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: 'Projet P.A.R.A.D.O.X.'
  vendor: 'Projet P.A.R.A.D.O.X.'
  synopsis: 'Launcher Minecraft moddé'
  description: 'Launcher du serveur Projet P.A.R.A.D.O.X. Les mods, les configurations et les mises à jour sont gérés automatiquement.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'